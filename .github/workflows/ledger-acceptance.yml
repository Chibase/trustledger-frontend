# Ledger + import acceptance (offline).
# pull_request paths: src/, docs/, tests/**, tools/**.
# No staging/production API calls. No repository secrets.

name: ledger-acceptance

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "jest.ledger.config.cjs"
      - "jest.ui.config.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ledger-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ledger-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pynacl pillow piexif

      - name: Run ledger tests + import dry-run
        run: bash tools/ci_run.sh

      - name: Upload acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-acceptance-log
          path: |
            tools/ci/acceptance_log.txt
            acceptance_log.txt
            tools/demo/srm-import/acceptance_log.txt
          if-no-files-found: ignore
